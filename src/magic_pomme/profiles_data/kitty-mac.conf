# ~/.config/kitty/kitty.conf
# macOS-like terminal on KDE Plasma / Wayland.
#
# WHY KITTY AND NOT KONSOLE
# After the hid_apple Cmd<->Ctrl swap, physical Cmd arrives as Control. In a
# terminal that means Cmd+C would send SIGINT instead of copying. kitty is the
# only readily packaged terminal with "copy_or_interrupt": it copies when there
# is a selection and sends SIGINT when there is not -- exactly how macOS
# Terminal behaves. Konsole cannot do this.
#
# AND THE SECOND HALF OF THE PROBLEM
# The swap also means physical Ctrl now arrives as Super, so every shell
# control sequence (Ctrl+C, Ctrl+R, Ctrl+D, Ctrl+Z, Ctrl+W, Ctrl+A ...) would
# be lost. The super+<key> block at the bottom sends the real control bytes,
# giving you back a working Ctrl key inside the terminal. That is what makes
# this feel like macOS rather than merely look like it.

# ---------------------------------------------------------------- Cmd bindings
# (physical Cmd arrives as "ctrl")
map ctrl+c  copy_or_interrupt
map ctrl+x  copy_and_clear_or_interrupt
map ctrl+v  paste_from_clipboard
map ctrl+t  new_tab
map ctrl+n  new_os_window
map ctrl+w  close_tab
map ctrl+q  quit
map ctrl+plus       change_font_size all +1.0
map ctrl+equal      change_font_size all +1.0
map ctrl+minus      change_font_size all -1.0
map ctrl+0          change_font_size all 0
map ctrl+k          clear_terminal scroll active
map ctrl+f          show_scrollback

# Cmd+1..9 -> jump to tab, like Safari/iTerm
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

# Cmd+Option+Left/Right arrive as Ctrl+PageUp/PageDown via the keyd config
map ctrl+page_up    previous_tab
map ctrl+page_down  next_tab

# ------------------------------------------------------------ look & behaviour
font_size 12.0
window_padding_width 6
cursor_shape block
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0
clipboard_control write-clipboard write-primary read-clipboard

# -------------------------------- restore a real Ctrl key (physical Ctrl=Super)
map super+a send_text all \x01
map super+b send_text all \x02
map super+c send_text all \x03
map super+d send_text all \x04
map super+e send_text all \x05
map super+f send_text all \x06
map super+g send_text all \x07
map super+h send_text all \x08
map super+i send_text all \x09
map super+j send_text all \x0a
map super+k send_text all \x0b
map super+l send_text all \x0c
map super+m send_text all \x0d
map super+n send_text all \x0e
map super+o send_text all \x0f
map super+p send_text all \x10
map super+q send_text all \x11
map super+r send_text all \x12
map super+s send_text all \x13
map super+t send_text all \x14
map super+u send_text all \x15
map super+v send_text all \x16
map super+w send_text all \x17
map super+x send_text all \x18
map super+y send_text all \x19
map super+z send_text all \x1a
map super+bracketleft  send_text all \x1b
map super+backslash    send_text all \x1c
map super+bracketright send_text all \x1d
map super+space        send_text all \x00
