<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 104" width="560" height="104">
  <title>magic-pomme wordmark</title>
  <!-- The media query lives inside the SVG so a single file works on light and
       dark, even when loaded via <img> where currentColor cannot inherit from
       the host document. -->
  <style>
    .word { fill: #17181C; }
    @media (prefers-color-scheme: dark) { .word { fill: #F2F2F2; } }
  </style>
  <g transform="translate(10 26) scale(2.1)" fill="none" stroke="#D23A38"
     stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>
  </g>
  <text class="word" x="136" y="68"
        font-family="Inter, 'Noto Sans', 'DejaVu Sans', system-ui, sans-serif"
        font-size="48" font-weight="650" letter-spacing="-1.4">magic-pomme</text>
</svg>
