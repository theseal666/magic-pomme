<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>magic-pomme - bitten keycap</title>
  <!-- The "bite out of both sides" gag, applied to a KEYCAP instead of an
       apple. Keeps the joke, keeps the keyboard theme, and borrows nobody's
       trademark. The bites are circular notches masked out of the cap. -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F0564B"/>
      <stop offset="1" stop-color="#A81F26"/>
    </linearGradient>
    <mask id="bites">
      <rect width="256" height="256" fill="#000"/>
      <rect x="38" y="34" width="180" height="188" rx="34" fill="#fff"/>
      <circle cx="38"  cy="118" r="33" fill="#000"/>
      <circle cx="218" cy="118" r="33" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#bites)">
    <rect x="38" y="34" width="180" height="188" rx="34" fill="url(#cap)"/>
    <rect x="38" y="34" width="180" height="188" rx="34" fill="none"
          stroke="#7A1119" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Stalk and leaf: enough fruit to justify the name, no apple silhouette. -->
  <path d="M128 36c0-10 2-18 6-24" stroke="#6B4A2F" stroke-width="7"
        stroke-linecap="round" fill="none"/>
  <path d="M136 16c16-9 32-6 37 2 5 9-4 22-20 29-10 4-20 3-25-3-5-6-2-22 8-28z"
        fill="#86B84A"/>

  <g transform="translate(64 86) scale(5.3)" fill="none" stroke="#fff"
     stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>
  </g>
</svg>
