# /etc/keyd/default.conf
# macOS text-editing and special-character behaviour, Swedish Apple keyboard.
#
# CONTEXT -- this config assumes hid_apple swap_ctrl_cmd=1 is active, so:
#     physical Cmd    arrives as Control  -> the [control] layer below IS Cmd
#     physical Ctrl   arrives as Meta     -> reserved for KDE window management
#     physical Option arrives as Alt      -> the [alt] layer below
#
# IMPORTANT -- keyd runs *below* xkb, so the right-hand side of each binding is
# a KEYCODE, not a character. Writing "8 = [" would emit the US-layout
# bracket keycode, which under se(mac) produces "aring". That is why the
# Swedish-Mac characters below are written as AltGr (G-) combinations: the
# se(mac) layout already maps AltGr+8 to "[", so emitting G-8 yields the
# correct character without hardcoding any layout assumption.
#
# The wildcard id keeps this working when the Magic Keyboard moves between
# USB and Bluetooth (which report different product ids). To scope it to one
# keyboard instead, replace * with the id from: sudo keyd monitor

[ids]
*

# ---------------------------------------------------------------- Cmd (= Ctrl)
[control]
left      = home          # Cmd+Left   -> start of line
right     = end           # Cmd+Right  -> end of line
up        = C-home        # Cmd+Up     -> start of document
down      = C-end         # Cmd+Down   -> end of document
backspace = macro(S-home backspace)   # Cmd+Backspace -> delete to line start

# ----------------------------------------------------------------- Option (= Alt)
[alt]
left      = C-left        # Option+Left      -> previous word
right     = C-right       # Option+Right     -> next word
backspace = C-backspace   # Option+Backspace -> delete previous word
delete    = C-delete      # Option+Delete    -> delete next word

# Swedish-Mac special characters on the LEFT Option key.
# (Right Option already produces these natively via se(mac)'s level-3 map.)
2 = G-2                   # @
3 = G-3                   # GBP
4 = G-4                   # $
7 = G-7                   # |
8 = G-8                   # [
9 = G-9                   # ]
e = G-e                   # EUR

# -------------------------------------------- composite layers (must come last)
[control+shift]
left  = S-home            # Cmd+Shift+Left  -> select to line start
right = S-end             # Cmd+Shift+Right -> select to line end
up    = C-S-home          # Cmd+Shift+Up    -> select to document start
down  = C-S-end           # Cmd+Shift+Down  -> select to document end

[alt+shift]
left  = C-S-left          # Option+Shift+Left  -> select previous word
right = C-S-right         # Option+Shift+Right -> select next word
7 = G-S-7                 # backslash
8 = G-S-8                 # {
9 = G-S-9                 # }

[control+alt]
left  = C-prior           # Cmd+Option+Left  -> previous browser/app tab
right = C-next            # Cmd+Option+Right -> next browser/app tab

# ---------------------------------------------------------------------------
# OPTIONAL: macOS's global emacs-style text bindings (Ctrl+A/E/K/D/N/P work in
# every macOS text field). Physical Ctrl arrives as Meta, so they would go in a
# [meta] layer -- but Meta+D, Meta+E and Meta+P are KDE defaults (show desktop,
# file manager, display config), so enabling this steals them. Uncomment only
# if you want it, and unbind those in System Settings > Shortcuts first.
#
# [meta]
# a = home
# e = end
# k = macro(S-end delete)
# d = delete
# n = down
# p = up
# f = right
# b = left
