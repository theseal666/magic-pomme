# macOS-like modifier behaviour for Apple keyboards
#
# swap_ctrl_cmd=1
#   Physical Cmd  -> reports as Control  (so Cmd+C copies, Cmd+S saves, ...)
#   Physical Ctrl -> reports as Super    (left free for KDE window management,
#                                         which conveniently mirrors macOS's
#                                         Ctrl-based Mission Control / Spaces)
#
# fnmode=1
#   Media keys are primary, matching the printed legends on the top row.
#   Hold Fn/Globe for real F1-F12. (Was 3 = auto.)
#
# iso_layout=-1
#   Leave on auto. If the key left of "1" and the key left of "Z" come out
#   swapped, set this to 0 and reload (see the notes from Claude).
options hid_apple swap_ctrl_cmd=1 fnmode=1 iso_layout=-1
